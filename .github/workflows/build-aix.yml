name: Build AIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build AIX
        id: build
        uses: pavi2410/AIX-Action@main
        with:
          source-dir: src
          package-name: com.gikku.transparentwebview
          appinventor-repo: mit-cml/appinventor-sources
          appinventor-branch: master

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: GikkuTransparentWebView-aix
          path: ${{ steps.build.outputs.extension-path }}
